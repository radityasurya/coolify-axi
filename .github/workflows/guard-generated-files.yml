name: guard-generated-files

on:
  pull_request:
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - package.json

jobs:
  guard:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject hand-edits to release-please output
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          for f in CHANGELOG.md .release-please-manifest.json; do
            if echo "$changed" | grep -qx "$f"; then
              echo "::error::$f is generated by release-please; do not hand-edit it"
              exit 1
            fi
          done
      - name: Reject hand-edits to the generated skill
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$changed" | grep -q '^skills/' && ! echo "$changed" | grep -q '^src/skill.js$'; then
            echo "::error::skills/ is generated from src/skill.js; run npm run build:skill"
            exit 1
          fi
