name: ci

on:
  push:
    branches: [main]
  pull_request:
    # release-please owns these. Its PRs touch only these four files, so no PR workflow runs on them.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - package.json
      - package-lock.json

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:skill
      - name: CLI answers --version and --help without a Coolify install
        run: |
          node bin/coolify-axi.js --version
          node bin/coolify-axi.js --help > /dev/null
